<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoviqAI</title>

  <style>
    body {
      margin: 0;
      background: #080b12;
      color: white;
      font-family: Arial;
      height: 100vh;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      border-bottom: 1px solid #252b38;
      font-size: 22px;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 12px;
      max-width: 80%;
      white-space: pre-wrap;
    }

    .user {
      background: #252b3a;
      margin-left: auto;
    }

    .bot {
      background: #151b27;
    }

    .input-area {
      padding: 12px;
      border-top: 1px solid #252b38;
    }

    .box {
      display: flex;
      gap: 8px;
    }

    #input {
      flex: 1;
      height: 45px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #151b27;
      color: white;
      padding: 0 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 50px;
      border: 0;
      border-radius: 10px;
      background: #7c6cff;
      color: white;
      font-size: 20px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>🤖 NoviqAI</header>

  <div id="messages">
    <div class="message bot">
      Hello! আমি NoviqAI 🤖<br>
      How can I help you?
    </div>
  </div>

  <div class="input-area">
    <div class="box">
      <input
        id="input"
        type="text"
        placeholder="Message NoviqAI..."
      >

      <button onclick="sendMessage()">↑</button>
    </div>
  </div>

</div>

<script>

const BACKEND_URL = "https://noviq-ai-2.onrender.com";

async function sendMessage() {

  const input = document.getElementById("input");
  const messages = document.getElementById("messages");

  const text = input.value.trim();

  if (!text) return;

  messages.innerHTML +=
    '<div class="message user">' +
    text +
    '</div>';

  input.value = "";

  messages.innerHTML +=
    '<div class="message bot" id="loading">NoviqAI is thinking...</div>';

  try {

    const response = await fetch(BACKEND_URL + "/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    document.getElementById("loading").textContent =
      data.reply || "No response.";

  } catch (error) {

    document.getElementById("loading").textContent =
      "Backend-এর সঙ্গে যোগাযোগ করা যাচ্ছে না।";

  }
}

</script>

</body>
</html>
