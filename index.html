<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NoviqAI — AI Assistant</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#212121;
  color:white;
  height:100vh;
  overflow:hidden;
}

.app{
  display:flex;
  height:100vh;
}

.sidebar{
  width:260px;
  background:#171717;
  padding:15px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:23px;
  font-weight:bold;
  padding:10px;
  margin-bottom:20px;
}

.new-chat{
  border:1px solid #444;
  background:transparent;
  color:white;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  text-align:left;
  font-size:15px;
}

.new-chat:hover{
  background:#2a2a2a;
}

.history{
  margin-top:25px;
  color:#aaa;
  font-size:13px;
}

.history-item{
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  color:#ddd;
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:60px;
  border-bottom:1px solid #333;
  display:flex;
  align-items:center;
  padding:0 20px;
  font-size:18px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:30px 15%;
}

.welcome{
  text-align:center;
  margin-top:15vh;
}

.welcome h1{
  font-size:34px;
  margin-bottom:12px;
}

.welcome p{
  color:#aaa;
}

.message{
  display:flex;
  gap:15px;
  margin:25px 0;
  line-height:1.6;
}

.avatar{
  width:34px;
  height:34px;
  min-width:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#6c5ce7;
  font-weight:bold;
}

.user .avatar{
  background:#444;
}

.text{
  max-width:850px;
  white-space:pre-wrap;
}

.input-area{
  padding:15px 15%;
  background:#212121;
}

.input-box{
  background:#2f2f2f;
  border:1px solid #444;
  border-radius:16px;
  display:flex;
  align-items:flex-end;
  padding:10px;
}

textarea{
  flex:1;
  resize:none;
  border:none;
  outline:none;
  background:transparent;
  color:white;
  font-size:16px;
  padding:8px;
}

.send{
  width:40px;
  height:40px;
  border:none;
  border-radius:10px;
  background:#6c5ce7;
  color:white;
  cursor:pointer;
  font-size:18px;
}

.note{
  text-align:center;
  color:#777;
  font-size:11px;
  margin-top:8px;
}

@media(max-width:700px){

  .sidebar{
    display:none;
  }

  .chat{
    padding:20px 15px;
  }

  .input-area{
    padding:10px;
  }

  .welcome h1{
    font-size:27px;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">
🤖 NoviqAI
</div>

<button class="new-chat" onclick="newChat()">
＋ New chat
</button>

<div class="history">
Recent chats
</div>

<div id="historyList"></div>

</aside>

<main class="main">

<header class="topbar">
<b>NoviqAI</b>
</header>

<section class="chat" id="chat">

<div class="welcome" id="welcome">

<h1>How can I help you?</h1>

<p>Ask NoviqAI anything.</p>

</div>

</section>

<div class="input-area">

<div class="input-box">

<textarea
id="input"
placeholder="Message NoviqAI..."
rows="1">
</textarea>

<button class="send" onclick="sendMessage()">
↑
</button>

</div>

<div class="note">
NoviqAI can make mistakes. Check important information.
</div>

</div>

</main>

</div>

<script>

function sendMessage(){

const input=document.getElementById("input");

const text=input.value.trim();

if(!text)return;

document.getElementById("welcome").style.display="none";

addMessage("user",text);

input.value="";

setTimeout(function(){

addMessage(
"ai",
"আমি NoviqAI 🤖।\n\nএখন আমি Demo Mode-এ আছি। পরে Backend এবং AI API যুক্ত করলে আমি সত্যিকারের AI উত্তর দিতে পারব।"
);

},700);

}


function addMessage(type,text){

const chat=document.getElementById("chat");

const message=document.createElement("div");

message.className="message "+type;

const avatar=document.createElement("div");

avatar.className="avatar";

avatar.innerText=type==="user"?"U":"N";

const content=document.createElement("div");

content.className="text";

content.innerText=text;

message.appendChild(avatar);

message.appendChild(content);

chat.appendChild(message);

chat.scrollTop=chat.scrollHeight;

}


function newChat(){

document.getElementById("chat").innerHTML=`

<div class="welcome" id="welcome">

<h1>How can I help you?</h1>

<p>Ask NoviqAI anything.</p>

</div>

`;

}


document.getElementById("input").addEventListener(
"keydown",
function(e){

if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();

sendMessage();

}

});

</script>

</body>
</html>
